<title>Qehreman Ceferov</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Tek karanlık görünüm: fırtınalı gece. Arkada kara bulutlar, yağmur, şimşek; üstünde yarı saydam kartlar. */
:root {
  color-scheme: dark;
  --bg: #06080B; --fg: #E6ECEF; --muted: #8C9BA6; --line: rgba(255,255,255,.09);
  --surface: rgba(12,17,23,.66); --accent: #8FB8D8; --accent-fg: #06121A; --accent-soft: rgba(143,184,216,.14);
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 25%, rgba(0,0,0,.78) 100%); }
.page { position: relative; z-index: 2; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.hero { padding-top: calc(env(safe-area-inset-top, 0px) + 48px); padding-bottom: 28px; }
.hero-body { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.avatar { width: 108px; height: 108px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.26); box-shadow: 0 0 0 6px rgba(143,184,216,.07), 0 10px 40px rgba(0,0,0,.7); flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 11vw, 48px); line-height: 1.04; margin: 0; text-wrap: balance; overflow-wrap: anywhere; letter-spacing: -.01em; }
.city { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }

main { display: flex; flex-direction: column; gap: 28px; padding-block: 12px 48px; }
h2 { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.list { background: var(--surface); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; min-height: 60px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-child { border-top: 0; }
a.row:active { background: var(--accent-soft); }
.badge { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; flex: none; }
.row-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.row-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.row-value { font-weight: 500; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.chev { color: var(--muted); flex: none; font-size: 20px; line-height: 1; }
.copy { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--accent); min-height: 40px; flex: none; }

.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile { aspect-ratio: 1; border: 1px solid var(--line); padding: 0; border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 100%; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }

.intro { position: fixed; inset: 0; z-index: 50; width: 100%; border: 0; border-radius: 0; background: rgba(3,5,8,.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); text-align: center; transition: opacity 1.4s ease; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro[hidden] { display: none; }
.intro-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.intro-tap { font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 7vw, 30px); color: var(--fg); }
.intro-sub { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .intro-tap { animation: breathe 3s ease-in-out infinite; } @keyframes breathe { 50% { opacity: .45; } } }

.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(2, 4, 6, .96); display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.lightbox[hidden] { display: none; }
.lightbox img { max-width: 100%; max-height: 84vh; object-fit: contain; }
.close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 999px; min-width: 44px; min-height: 44px; font-size: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
</style>
</head>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* Toast, kopyalama, fotoğraf büyütme */
  var timer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(timer); timer = setTimeout(function () { t.hidden = true; }, 2200);
  }
  $("copyMail").addEventListener("click", function () {
    var text = $("mail").textContent;
    function fail() {
      try { var r = document.createRange(); r.selectNodeContents($("mail")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
      toast("Kopyalanmadı, mətni seçib kopyala");
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("Kopyalandı"); }, fail);
      else fail();
    } catch (e) { fail(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (b) {
    b.addEventListener("click", function () { $("lbImg").src = b.querySelector("img").src; $("lb").hidden = false; });
  });
  $("lbClose").addEventListener("click", function () { $("lb").hidden = true; });
  $("lb").addEventListener("click", function (e) { if (e.target === $("lb")) $("lb").hidden = true; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("lb").hidden = true; });

  /* ===== Fırtına: bulut, yağmur, şimşek ===== */
  var cv = $("bg"), g = cv.getContext("2d"), W = 0, H = 0;
  var clouds = [], drops = [], flash = 0, bolt = null;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init() {
    size();
    var tints = [[34, 44, 62], [26, 34, 50], [44, 48, 70], [18, 26, 40], [38, 42, 58]];
    var big = Math.max(W, H);
    clouds = tints.map(function (c, i) {
      return { x: rnd(0, W), y: rnd(-0.05, 0.55) * H, r: rnd(0.4, 0.75) * big, vx: rnd(0.12, 0.34) * (i % 2 ? 1 : -1), c: c, a: rnd(0.26, 0.42) };
    });
    var n = W < 500 ? 110 : 190;
    drops = [];
    for (var i = 0; i < n; i++) {
      var near = i % 3 === 0;
      drops.push({ x: rnd(-40, W + 40), y: rnd(0, H), len: near ? rnd(16, 26) : rnd(8, 15), sp: near ? rnd(20, 28) : rnd(12, 18), near: near });
    }
  }
  function makeBolt() {
    var segs = [], x = rnd(0.2, 0.8) * W;
    function line(x1, y1, x2, y2, d, w, depth) {
      if (d < 4 || depth > 7) { segs.push([x1, y1, x2, y2, w]); return; }
      var mx = (x1 + x2) / 2 + rnd(-d, d), my = (y1 + y2) / 2 + rnd(-d * 0.4, d * 0.4);
      line(x1, y1, mx, my, d / 2, w, depth + 1);
      line(mx, my, x2, y2, d / 2, w, depth + 1);
      if (Math.random() < 0.16 && w > 1.2) line(mx, my, mx + rnd(-0.25, 0.25) * W, my + rnd(0.1, 0.3) * H, d * 0.6, w * 0.55, depth + 2);
    }
    line(x, -10, x + rnd(-0.2, 0.2) * W, rnd(0.5, 0.85) * H, W * 0.22, 2.6, 0);
    return segs;
  }
  function draw() {
    g.clearRect(0, 0, W, H);
    var boost = 1 + flash * 1.6;
    clouds.forEach(function (b) {
      if (!reduce) {
        b.x += b.vx;
        if (b.vx > 0 && b.x > W + b.r * 0.5) b.x = -b.r * 0.5;
        if (b.vx < 0 && b.x < -b.r * 0.5) b.x = W + b.r * 0.5;
      }
      var gr = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      var a = Math.min(b.a * boost, 0.9).toFixed(3);
      gr.addColorStop(0, "rgba(" + b.c[0] + "," + b.c[1] + "," + b.c[2] + "," + a + ")");
      gr.addColorStop(1, "rgba(" + b.c[0] + "," + b.c[1] + "," + b.c[2] + ",0)");
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    });
    if (!reduce) {
      [false, true].forEach(function (near) {
        g.beginPath();
        drops.forEach(function (d) {
          if (d.near !== near) return;
          d.y += d.sp; d.x += d.sp * 0.2;
          if (d.y > H + 30) { d.y = -30; d.x = rnd(-40, W + 40); }
          g.moveTo(d.x, d.y); g.lineTo(d.x + d.len * 0.2, d.y + d.len);
        });
        g.strokeStyle = near ? "rgba(175,200,225,0.30)" : "rgba(150,175,200,0.16)";
        g.lineWidth = near ? 1.2 : 0.8;
        g.stroke();
      });
    }
    if (flash > 0.01) {
      g.fillStyle = "rgba(180,200,255," + (flash * 0.26).toFixed(3) + ")";
      g.fillRect(0, 0, W, H);
      if (bolt) {
        g.lineCap = "round";
        [[5, 0.22], [1, 1]].forEach(function (pass) {
          g.beginPath();
          bolt.forEach(function (s) { g.moveTo(s[0], s[1]); g.lineTo(s[2], s[3]); });
          g.lineWidth = pass[0] * 2.2; g.strokeStyle = "rgba(225,236,255," + Math.min(flash * pass[1], 1).toFixed(3) + ")";
          g.stroke();
        });
      }
      flash *= 0.91;
    } else if (flash) { flash = 0; bolt = null; }
    if (!reduce) requestAnimationFrame(draw);
  }
  function strike() {
    bolt = makeBolt(); flash = 1;
    setTimeout(function () { flash = Math.max(flash, 0.6); }, 160);
    setTimeout(thunder, rnd(500, 2200));
  }
  function nextStrike() {
    setTimeout(function () { if (!document.hidden) strike(); nextStrike(); }, rnd(6500, 13500));
  }
  init();
  draw();
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { init(); if (reduce) draw(); }, 200); });
  if (!reduce) nextStrike();

  /* ===== Ses: karanlık drone, yağmur, rüzgar, gök gürültüsü (hepsi Web Audio ile üretilir) ===== */
  var ctx = null, master, bus, rev, noiseW, noiseB, started = false, noteTimer;
  function mkNoise(ac, brown, sec) {
    var len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c), last = 0;
      for (var i = 0; i < len; i++) {
        var w = Math.random() * 2 - 1;
        if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
    }
    return b;
  }
  function mkReverb(ac) {
    var len = ac.sampleRate * 5, buf = ac.createBuffer(2, len, ac.sampleRate);
    for (var c = 0; c < 2; c++) { var d = buf.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    var cn = ac.createConvolver(); cn.buffer = buf; return cn;
  }
  function loop(buf) { var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }
  function filt(type, f, q) { var n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gain(v) { var n = ctx.createGain(); n.gain.value = v; return n; }

  function build() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = gain(0);
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    rev = mkReverb(ctx); var wet = gain(0.55); rev.connect(wet); wet.connect(master);
    bus = gain(1); bus.connect(master); bus.connect(rev);
    noiseW = mkNoise(ctx, false, 3); noiseB = mkNoise(ctx, true, 6);

    /* Karanlık pad: re minör, alçak, hafif ses uyumsuzluğu (mi bemol) */
    var lp = filt("lowpass", 300, 0.8); lp.connect(bus);
    var lfo = ctx.createOscillator(), lg = gain(180); lfo.frequency.value = 0.035; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    var swell = gain(1); swell.connect(lp);
    var sw = ctx.createOscillator(), swg = gain(0.25); sw.frequency.value = 0.06; sw.connect(swg); swg.connect(swell.gain); sw.start();
    [[36.71, "sine", 0.22], [73.42, "sawtooth", 0.05], [87.31, "triangle", 0.04], [110, "triangle", 0.03], [77.78, "triangle", 0.014]].forEach(function (p) {
      [-7, 7].forEach(function (det) {
        var o = ctx.createOscillator(), gn = gain(p[2]);
        o.type = p[1]; o.frequency.value = p[0]; o.detune.value = det;
        o.connect(gn); gn.connect(swell); o.start();
      });
    });

    /* Yağmur */
    var rain = loop(noiseW), rhp = filt("highpass", 1000), rlp = filt("lowpass", 7500), rg = gain(0.055);
    rain.connect(rhp); rhp.connect(rlp); rlp.connect(rg); rg.connect(master);

    /* Rüzgar */
    var wind = loop(noiseB), wbp = filt("bandpass", 260, 0.9), wg = gain(0.22);
    var wl = ctx.createOscillator(), wlg = gain(0.12); wl.frequency.value = 0.08; wl.connect(wlg); wlg.connect(wg.gain); wl.start();
    wind.connect(wbp); wbp.connect(wg); wg.connect(master);
    return true;
  }
  function note() {
    if (!started || !ctx) return;
    var f = [73.42, 110, 146.83, 174.61, 220, 261.63][Math.floor(Math.random() * 6)], t = ctx.currentTime;
    var o = ctx.createOscillator(), gn = gain(0), lp2 = filt("lowpass", 900);
    o.type = "sine"; o.frequency.value = f;
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.08, t + 0.7); gn.gain.exponentialRampToValueAtTime(0.0005, t + 8);
    o.connect(lp2); lp2.connect(gn); gn.connect(bus); o.start(t); o.stop(t + 8.2);
    noteTimer = setTimeout(note, rnd(5500, 11000));
  }
  function thunder() {
    if (!started || !ctx || ctx.state !== "running") return;
    var t = ctx.currentTime, dur = rnd(5.5, 7.5);
    var s = ctx.createBufferSource(); s.buffer = noiseB;
    var lp = filt("lowpass", 520);
    lp.frequency.setValueAtTime(520, t); lp.frequency.exponentialRampToValueAtTime(70, t + dur);
    var gn = ctx.createGain();
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(2.6, t + 0.07);
    gn.gain.linearRampToValueAtTime(1.0, t + 0.8); gn.gain.linearRampToValueAtTime(1.9, t + 1.4);
    gn.gain.linearRampToValueAtTime(0.7, t + 2.5); gn.gain.linearRampToValueAtTime(1.1, t + 3.1);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    var send = gain(0.45);
    s.connect(lp); lp.connect(gn); gn.connect(master); gn.connect(send); send.connect(rev);
    s.start(t, rnd(0, 2)); s.stop(t + dur + 0.1);
    /* çatırtı */
    var c = ctx.createBufferSource(); c.buffer = noiseW;
    var chp = filt("highpass", 1400), cg = gain(0.32);
    cg.gain.setValueAtTime(0.32, t); cg.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    c.connect(chp); chp.connect(cg); cg.connect(master); c.start(t); c.stop(t + 0.35);
    /* alt gümbürtü */
    var o = ctx.createOscillator(), og = gain(0);
    o.type = "sine"; o.frequency.setValueAtTime(48, t); o.frequency.exponentialRampToValueAtTime(28, t + 2);
    og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.7, t + 0.1); og.gain.exponentialRampToValueAtTime(0.001, t + 2.4);
    o.connect(og); og.connect(master); o.start(t); o.stop(t + 2.5);
  }

  var intro = $("intro"), introGone = false;
  function hideIntro() {
    if (introGone) return; introGone = true;
    intro.classList.add("gone");
    setTimeout(function () { intro.hidden = true; }, 1500);
  }
  function begin() {
    if (started) return;
    if (!ctx && !build()) { hideIntro(); return; }
    started = true;
    var p = ctx.resume(); if (p && p.catch) p.catch(function () {});
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0.65, ctx.currentTime, 3);
    hideIntro();
    noteTimer = setTimeout(note, 2500);
    if (!reduce) setTimeout(strike, 1500);
  }
  /* Tarayıcı izin veriyorsa kendiliğinden başla, vermiyorsa ilk dokunuşta başla */
  try {
    if (build()) {
      var pr = ctx.resume();
      if (pr && pr.then) pr.then(function () { if (ctx.state === "running") begin(); }, function () {});
    }
  } catch (e) {}
  ["click", "touchend", "pointerup", "keydown"].forEach(function (ev) { document.addEventListener(ev, begin, { passive: true }); });
  document.addEventListener("visibilitychange", function () {
    if (!ctx || !started) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });
})();
</script>
</body>
</html>
